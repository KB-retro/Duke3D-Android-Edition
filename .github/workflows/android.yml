name: Android

# Se compila a mano: Actions → Android → Run workflow.
on:
  workflow_dispatch:

env:
  SDL_VERSION: "2.30.9"

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Caché de SDL2
        id: sdl
        uses: actions/cache@v4
        with:
          path: android/SDL2
          key: sdl2-${{ env.SDL_VERSION }}

      - name: Descargar SDL2
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xzf sdl.tar.gz
          mv "SDL2-${SDL_VERSION}" android/SDL2

      # Compila solo el código nativo sin parar en el primer fallo, para ver todos los errores
      # de una vez en el resumen. Si todo va bien, Gradle reutiliza poco de esto (es rápido).
      - name: Código nativo (todos los errores)
        run: |
          SDK=/usr/local/lib/android/sdk
          NDK=$SDK/ndk/27.2.12479018
          command -v ninja >/dev/null || sudo apt-get install -y ninja-build
          cmake -S android/app/src/main/cpp -B nativo -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=26 -DANDROID_STL=c++_shared \
            -DCMAKE_BUILD_TYPE=Release -DSDL2_DIR=$PWD/android/SDL2
          set +e
          ninja -C nativo -k 0 main > nativo.log 2>&1
          rc=$?
          set -e
          if [ $rc -ne 0 ]; then
            echo "::group::Errores"
            grep -E "error:|undefined (symbol|reference)" nativo.log | sed 's|.*/eduke32/source/||' | sort -u | head -200
            echo "::endgroup::"
            grep -E "error:|undefined (symbol|reference)" nativo.log | sed 's|.*/eduke32/source/||' | sort -u | head -200 >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Clave de firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duke3d.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/duke3d.p12" >> "$GITHUB_ENV"
          else
            echo "Sin clave de firma en los secretos: se firma con la clave de depuración."
          fi

      - name: Compilar
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          mkdir -p ../salida
          cp app/build/outputs/apk/release/app-release.apk "../salida/Duke3D-Android-Edition-0.1.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Duke3D-Android-Edition-0.1.${{ github.run_number }}
          path: salida/*.apk
          retention-days: 14
