name: Raze

# Motor Raze para Android (APK aparte). Se compila a mano: Actions → Raze → Run workflow.
# De momento compila solo el código nativo (libmain.so y sus bibliotecas) y enseña todos los
# errores de una vez en el resumen del run.
on:
  workflow_dispatch:

env:
  SDL_VERSION: "2.30.9"
  NDK_VERSION: "27.2.12479018"
  API: "26"

jobs:
  nativo:
    name: Raze nativo
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Antes de descargar nada: setup-gradle revisa todos los gradle-wrapper.jar de la carpeta.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Versiones
        run: cat raze/ORIGEN.txt | grep = >> "$GITHUB_ENV"

      - name: Paquetes del sistema
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libsdl2-dev ccache

      - name: NDK y CMake
        run: |
          SDKM=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin | head -1)/sdkmanager
          yes | $SDKM --install "ndk;${NDK_VERSION}" "cmake;3.22.1" > /dev/null
          echo "NDK=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Descargar Raze, ZMusic, OpenAL y SDL2
        run: |
          git init -q raze-src
          git -C raze-src fetch -q --depth 1 https://github.com/ZDoom/Raze.git "$RAZE_COMMIT"
          git -C raze-src checkout -q FETCH_HEAD
          git clone -q --depth 1 --branch "$ZMUSIC_TAG" https://github.com/ZDoom/ZMusic.git zmusic
          git clone -q --depth 1 --branch "$OPENAL_TAG" https://github.com/kcat/openal-soft.git openal
          curl -fsSL -o sdl.tar.gz "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL2-${SDL_VERSION}.tar.gz"
          tar xzf sdl.tar.gz && mv "SDL2-${SDL_VERSION}" sdl2
          python3 raze/parchear.py raze-src
          python3 raze/zmusic/parchear.py zmusic
          git clone -q --depth 1 --recursive https://github.com/bylaws/libadrenotools.git adrenotools

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: raze-ccache-${{ github.run_id }}
          restore-keys: raze-ccache-

      # Herramientas que Raze ejecuta al compilar (zipdir, lemon, re2c), para este PC.
      - name: Herramientas (PC)
        run: |
          cmake -S zmusic -B zm-pc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=$PWD/pc
          ninja -C zm-pc install > /dev/null
          cmake -S raze-src -B raze-pc -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$PWD/pc \
            -DHAVE_VULKAN=OFF -DNO_GTK=ON
          ninja -C raze-pc zipdir lemon re2c

      - name: Bibliotecas para Android (SDL2, OpenAL, ZMusic)
        run: |
          A="-G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake
             -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=$API -DANDROID_STL=c++_shared
             -DCMAKE_INSTALL_PREFIX=$PWD/prefijo -DCMAKE_FIND_ROOT_PATH=$PWD/prefijo
             -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          cmake -S sdl2 -B sdl-a $A -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST=OFF
          ninja -C sdl-a install > /dev/null
          cmake -S openal -B openal-a $A -DALSOFT_UTILS=OFF -DALSOFT_EXAMPLES=OFF -DALSOFT_TESTS=OFF \
            -DALSOFT_INSTALL_CONFIG=OFF -DALSOFT_INSTALL_HRTF_DATA=OFF -DALSOFT_INSTALL_AMBDEC_PRESETS=OFF
          ninja -C openal-a install > /dev/null
          cmake -S zmusic -B zm-a $A
          ninja -C zm-a install > /dev/null
          # libadrenotools: carga drivers Vulkan propios (malisx2) sin root.
          cmake -S adrenotools -B adreno-a $A -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a
          ninja -C adreno-a
          cp -r adrenotools/include/adrenotools prefijo/include/
          echo "ADRENOTOOLS_LIBS=$(find $PWD/adreno-a -name libadrenotools.a | head -1);$(find $PWD/adreno-a -name liblinkernsbypass.a | head -1)" >> "$GITHUB_ENV"
          mkdir -p prefijo/hooks
          find adreno-a -name '*_hook.so' -exec cp {} prefijo/hooks/ \;
          find adreno-a -name 'libhook_impl.so' -exec cp {} prefijo/hooks/ \;
          ls -la prefijo/hooks
          ls -la prefijo/lib

      - name: Raze para Android (todos los errores)
        run: |
          cmake -S raze-src -B raze-a -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=$NDK/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=$API -DANDROID_STL=c++_shared \
            -DCMAKE_FIND_ROOT_PATH=$PWD/prefijo -DCMAKE_PREFIX_PATH=$PWD/prefijo \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DIMPORT_EXECUTABLES=$PWD/raze-pc/ImportExecutables.cmake \
            -DSDL2_INCLUDE_DIR=$PWD/prefijo/include/SDL2 -DSDL2_LIBRARY=$PWD/prefijo/lib/libSDL2.so \
            -DCMAKE_C_FLAGS="-I$PWD/prefijo/include" -DCMAKE_CXX_FLAGS="-I$PWD/prefijo/include" \
            -DOPENAL_INCLUDE_DIR=$PWD/prefijo/include/AL -DOPENAL_LIBRARY=$PWD/prefijo/lib/libopenal.so \
            -DZMUSIC_INCLUDE_DIR=$PWD/prefijo/include -DZMUSIC_LIBRARIES=$PWD/prefijo/lib/libzmusic.so \
            "-DADRENOTOOLS_LIBS=$ADRENOTOOLS_LIBS" \
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DHAVE_VULKAN=ON -DVULKAN_USE_XLIB=OFF -DVULKAN_USE_WAYLAND=OFF -DHAVE_GLES2=OFF -DNO_GTK=ON -DNO_OPENMP=ON -DHAVE_VM_JIT=OFF 2>&1 | tee cmake.log
          set +e
          ninja -C raze-a -k 0 > nativo.log 2>&1
          rc=$?
          set -e
          ccache -s || true
          if [ $rc -ne 0 ]; then
            grep -E "error:|undefined (symbol|reference)|FAILED|Error" nativo.log | sed 's|.*/raze-src/||' | sort -u | head -300 | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ls -la raze-a

      - name: Registro de la compilación
        if: always()
        run: |
          mkdir -p salida
          cp -f nativo.log cmake.log salida/ 2>/dev/null || true

      # ---- APK (el mismo lanzador que el de EDuke32, con Raze dentro) ----

      - name: Bibliotecas y datos en el proyecto
        run: |
          cp -r sdl2 android/SDL2
          J=android/app/src/raze/jniLibs/arm64-v8a
          D=android/app/src/raze/assets/raze
          mkdir -p $J $D
          cp $(find raze-a -name libmain.so | head -1) $J/
          cp prefijo/lib/libSDL2.so prefijo/lib/libopenal.so prefijo/lib/libzmusic.so $J/
          cp prefijo/hooks/*.so $J/
          # Driver Vulkan malisx2 para GPU Mali (opción de Extras), última versión publicada.
          murl=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/bmdhacks/malisx2/releases/latest" \
            | python3 -c "import json,sys
          for a in json.load(sys.stdin)['assets']:
              if a['name'] == 'libvulkan_malisx2.so': print(a['browser_download_url'])")
          echo "malisx2: $murl"
          if [ -n "$murl" ]; then curl -fsSL -o $J/libvulkan_malisx2.so "$murl"; fi
          cp $NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/libc++_shared.so $J/
          find raze-a -name '*.pk3' -exec cp {} $D/ \;
          mkdir -p $D/soundfonts
          cp raze-src/soundfont/*.sf2 $D/soundfonts/
          # Capas de validación de Vulkan (diagnóstico: apuntan en el registro los usos incorrectos).
          url=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" "https://api.github.com/repos/KhronosGroup/Vulkan-ValidationLayers/releases?per_page=10" \
            | python3 -c "import json,sys
          for r in json.load(sys.stdin):
              for a in r['assets']:
                  if 'android' in a['name'].lower() and a['name'].endswith('.zip'):
                      print(a['browser_download_url']); raise SystemExit")
          echo "Capas de validación: $url"
          if [ -n "$url" ]; then
            curl -fsSL -o capas.zip "$url"
            unzip -o -q capas.zip -d capas
            find capas -name 'libVkLayer_khronos_validation.so' -exec cp {} $J/ \;
          fi
          ls -laR $J $D
          $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf -d $J/libmain.so | grep NEEDED

      - name: Clave de firma
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          if [ -n "$SIGNING_KEYSTORE_BASE64" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/duke3d.p12"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/duke3d.p12" >> "$GITHUB_ENV"
            if [ -z "$SIGNING_KEY_ALIAS" ]; then
              alias=$(keytool -list -keystore "$RUNNER_TEMP/duke3d.p12" -storetype PKCS12 \
                -storepass "$SIGNING_STORE_PASSWORD" | grep -i PrivateKeyEntry | head -1 | cut -d, -f1)
              echo "SIGNING_KEY_ALIAS=$alias" >> "$GITHUB_ENV"
            else
              echo "SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS" >> "$GITHUB_ENV"
            fi
          fi

      - name: APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRazeRelease --stacktrace
          cp app/build/outputs/apk/raze/release/app-raze-release.apk "../salida/Duke3D-Raze-Edition-0.1.${VERSION_CODE}.apk"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Duke3D-Raze-Edition-0.1.${{ github.run_number }}
          path: salida
          retention-days: 14
